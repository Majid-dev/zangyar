services:
  postgres:
    image: postgres:17-alpine
    container_name: zangyar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: zangyar
      POSTGRES_USER: zangyar
      POSTGRES_PASSWORD: zangyar_dev
    ports:
      - "5432:5432"
    volumes:
      - zangyar-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zangyar -d zangyar"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  zangyar-postgres-data:
